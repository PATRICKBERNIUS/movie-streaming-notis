<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the full iPhone screen; style.css
       then pads around the notch and home bar with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110F">
  <title>Movie Streaming Update</title>

  <!-- Installable app (Stage 4). The manifest describes the app to Android
       and desktop browsers. Paths are relative because the site lives under
       /movie-streaming-notis/ on GitHub Pages, not at the domain root. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <!-- iPhone reads these tags instead of the manifest for some settings. -->
  <!-- The home-screen icon. iOS rounds the corners itself. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Open full-screen from the home screen, with no Safari address bar. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- The label under the icon (iOS cuts off anything past about 12 characters). -->
  <meta name="apple-mobile-web-app-title" content="Movie Update">
  <!-- The page draws behind the status bar (time, battery); the safe-area
       padding in style.css keeps our content below it. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Two "screens" in one page. app.js shows one and hides the other, so
       there is no page reload and no second HTML file to keep in sync. -->

  <main id="login-view" class="login" hidden>
    <h1>Movie Streaming Update</h1>
    <form id="login-form">
      <label for="passphrase">Passphrase</label>
      <!-- type=password + autocomplete lets the iPhone keychain offer to save it. -->
      <input id="passphrase" type="password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <main id="app-view" hidden>
    <header class="topbar">
      <h1>Movie Streaming Update</h1>
      <button id="lock-button" class="quiet" type="button">Lock</button>
    </header>

    <div id="add-area" class="add-area">
      <form id="add-form" class="add-form">
        <input id="add-title" type="text" placeholder="Movie title" aria-label="Movie title"
               maxlength="200" autocomplete="off" required>
        <!-- inputmode=numeric shows the number pad on phones; a type=number field
             would add spinner arrows and accept things like "2e3". -->
        <input id="add-year" type="text" inputmode="numeric" placeholder="Year"
               aria-label="Year (optional)" pattern="\d{4}" maxlength="4">
        <button id="add-button" type="submit">Add</button>
      </form>
      <!-- TMDB suggestions while you type. Picking one fills in the exact
           title and year and remembers which film you meant. -->
      <ul id="suggestions" class="suggestions" aria-label="Suggestions" hidden></ul>
    </div>

    <!-- <details> is a built-in collapsible section: no JavaScript needed to
         open and close it, and it keeps the grid as the first thing you see. -->
    <details id="services-panel" class="services">
      <summary>Your services <span id="services-count" class="muted"></span></summary>
      <ul id="services-list" class="chips"></ul>
      <form id="service-form" class="service-form">
        <!-- list= links the input to the suggestions below. Names must match
             what Watchmode calls each service, so suggestions avoid typos. -->
        <input id="service-name" type="text" list="service-suggestions"
               placeholder="Add a service" aria-label="Service name"
               maxlength="60" autocomplete="off" required>
        <button id="service-button" type="submit">Add</button>
      </form>
      <datalist id="service-suggestions">
        <option value="Netflix"><option value="Hulu"><option value="Max">
        <option value="Disney+"><option value="Amazon Prime Video"><option value="Apple TV+">
        <option value="Peacock"><option value="Paramount+"><option value="Crunchyroll">
        <option value="Starz"><option value="MGM+"><option value="AMC+"><option value="Criterion Channel">
      </datalist>
    </details>

    <!-- One-time (or occasional) review: find the TMDB match for movies that
         don't have one yet, let you correct or skip each, then save in one go. -->
    <section id="match-view" class="match" hidden>
      <h2>Match years</h2>
      <p class="muted">Check each match. Pick a different film from the list, or
        "Skip" if none is right. Nothing is saved until you tap Save.</p>
      <ul id="match-list" class="match-list"></ul>
      <div class="match-actions">
        <button id="match-save" type="button">Save matches</button>
        <button id="match-cancel" class="quiet" type="button">Cancel</button>
      </div>
    </section>

    <div id="toolbar" class="toolbar">
      <button id="check-button" type="button">Check availability</button>
      <button id="match-button" class="secondary" type="button" hidden>Match years</button>
      <label class="sort">
        Sort
        <select id="sort-select">
          <option value="title">Title</option>
          <option value="year">Year</option>
        </select>
      </label>
    </div>

    <!-- role=status makes screen readers announce messages written here. -->
    <p id="status" class="status" role="status"></p>

    <!-- Filled by app.js: one grid before a check, three groups after. -->
    <div id="results"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
